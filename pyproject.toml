[project]
name = "python-upload-interview"
version = "0.1.0"
description = "Standalone Python, Pydantic, and SQL interview exercise"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.12,<3"]

[dependency-groups]
dev = ["ruff>=0.14,<1"]

[tool.uv]
package = false

[tool.uv.workspace]
members = []

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.format]
quote-style = "single"